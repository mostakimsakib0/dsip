<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <nav class="navbar">
            <h1>Smart Attendance</h1>
            <div class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/attendance">Live Attendance</a>
                <a href="/register">Register Student</a>
                <a href="/reports">Reports</a>
                <a href="/">Logout</a>
            </div>
        </nav>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Students</h3>
                <div class="value" id="totalStudents">0</div>
            </div>
            <div class="stat-card">
                <h3>Present Today</h3>
                <div class="value" id="presentToday">0</div>
            </div>
            <div class="stat-card">
                <h3>Attendance Rate</h3>
                <div class="value" id="attendanceRate">0%</div>
            </div>
        </div>

        <div class="attendance-table">
            <h3>Today's Attendance</h3>
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Time</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody id="attendanceBody">
                    <tr>
                        <td colspan="4" style="text-align:center;color:rgba(255,255,255,0.4);">No attendance records yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
