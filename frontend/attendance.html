<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Attendance - Smart Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .camera-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .video-wrapper {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-wrapper video {
            width: 100%;
            display: block;
        }
        .video-wrapper canvas {
            width: 100%;
            display: none;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .controls .btn {
            flex: 0 0 auto;
            padding: 12px 30px;
            width: auto;
        }
        .btn-start {
            background: linear-gradient(135deg, #00b894, #00cec9);
        }
        .btn-stop {
            background: linear-gradient(135deg, #d63031, #e17055);
        }
        .status {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <nav class="navbar">
            <h1>Smart Attendance</h1>
            <div class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/attendance">Live Attendance</a>
                <a href="/register">Register Student</a>
                <a href="/reports">Reports</a>
                <a href="/">Logout</a>
            </div>
        </nav>

        <div class="camera-container">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
            <div class="video-wrapper" style="flex:1;">
                <div style="padding:20px;color:#fff;">
                    <h3 style="margin-bottom:15px;">Recognition Log</h3>
                    <div id="recognitionLog" style="max-height:300px;overflow-y:auto;font-size:13px;color:rgba(255,255,255,0.7);">
                        Waiting for camera...
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn">Start Camera</button>
            <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
            <div class="status" id="statusText">Camera is off</div>
        </div>
    </div>

    <script src="js/camera.js"></script>
</body>
</html>
