[project]
name = "dsip"
version = "1.0.0"
description = "CSE434 Course Project"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "insightface (>=1.0.1,<2.0.0)",
    "opencv-python (>=4.9.0.0)",
    "opencv-contrib-python (>=4.9.0.0)",
    "onnxruntime (>=1.17.0)",
    "numpy (>=1.26.0)",
    "scikit-learn (>=1.4.2)",
    "flask (>=3.0.0)",
    "flask-cors (>=4.0.1)",
    "flask-socketio (>=5.3.6)",
    "python-socketio (>=5.11.4)",
    "eventlet (>=0.36.1)",
    "pandas (>=2.2.2)",
    "openpyxl (>=3.1.2)",
    "pillow (>=10.3.0)",
    "gunicorn (>=22.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
